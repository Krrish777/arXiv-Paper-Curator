[project]
name = "arxiv-paper-curator"
version = "0.1.0"
description = "Production grade RAG for research paper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API Framework
    "fastapi[standard]>=0.116.1",
    # Database & Schemas
    "asyncpg>=0.30.0",
    "alembic>=1.16.4",
    "sqlalchemy>=2.0.42",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    # Search & Vector
    "opensearch-py>=3.0.0",
    "pgvector>=0.4.1",
    # HTTP & Cache
    "httpx>=0.28.1",
    "redis>=6.4.0",
    #ML/AI
    "openai>=1.99.5",
    # Monitoring & Logging
    "prometheus-client>=0.22.1",
    "structlog>=25.4.0",
    "mypy>=1.17.1",
    "uvicorn>=0.35.0",
    "huggingface-hub>=0.34.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
]
